<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Halaman Tidak Ditemukan</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/356759612?v=4">
  <link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/356759612?v=4">
  <style>
    :root {
      --bg-paper: #f4f1ea;
      --text-ink: #1e2022;
      --text-muted: #525860;
      --accent-brass: #14532D;
      --border-line: #d4cfc3;
      --card-bg: #ebe6da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-paper: #161819;
        --text-ink: #e5e0d8;
        --text-muted: #9da5b0;
        --accent-brass: #4ade80;
        --border-line: #2d3135;
        --card-bg: #1e2124;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-paper);
      color: var(--text-ink);
      font-family: "Courier New", Courier, monospace;
      line-height: 1.7;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 680px;
      width: 100%;
      border: 1px solid var(--border-line);
      padding: 2.5rem 2rem;
      background-color: var(--bg-paper);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    .tag-error {
      display: inline-block;
      font-size: 0.78rem;
      color: var(--accent-brass);
      border: 1px solid var(--accent-brass);
      padding: 0.2rem 0.6rem;
      margin-bottom: 1.2rem;
      letter-spacing: 1px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 3.5rem;
      letter-spacing: 2px;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }
    .subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 1.5rem; }
    .message-box {
      background-color: var(--card-bg);
      border-left: 3px solid var(--accent-brass);
      padding: 1rem 1.2rem;
      margin-bottom: 1.8rem;
      font-size: 0.92rem;
      text-align: left;
    }
    .btn-home {
      display: inline-block;
      text-decoration: none;
      color: var(--text-ink);
      border: 1px solid var(--border-line);
      padding: 0.65rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      border-color: var(--accent-brass);
      background-color: var(--card-bg);
      color: var(--accent-brass);
    }
    footer {
      border-top: 1px solid var(--border-line);
      margin-top: 2rem;
      padding-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a,
    footer a:visited {
      color: var(--accent-brass);
      text-decoration: none;
      font-weight: 700;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="tag-error">● GALAT 404 // @OEIBOEO</div>
    <h1>404</h1>
    <p class="subtitle">Lembar Arsip Tidak Ditemukan</p>
    <div class="message-box">
      <p>Berkas atau halaman yang Anda cari tidak tersedia di direktori ini. Mungkin tautan telah dipindahkan atau alamat diketik keliru.</p>
    </div>
    <a href="/" class="btn-home">&larr; Kembali ke Beranda</a>
    <footer>&copy; 2026 Satrijo Oeiboeo (<a href="mailto:satrijo.oeiboeo@gmail.com">@oeiboeo</a>) &mdash; Semua hak dilindungi undang-undang.</footer>
  </main>
</body>
</html>
